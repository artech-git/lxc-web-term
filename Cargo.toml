[package]
name = "lwt"
version = "0.1.0"
edition = "2021"
description = "LXC Web Terminal — daemon and control CLI for web-based LXC container shells"

[[bin]]
name = "lwt"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.1", features = ["macros"] }
clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4.5.40"
daemonize = "0.5.0"
dashmap = "6.1.0"
dotenv = { version = "0.15.0", features = ["cli"] }
futures = "0.3.31"
http-error-derive = "0.3.2"
jsonwebtoken = "9.3.1"
libc = "0.2.169"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tokio = { version = "1.43.0", features = ["full", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
uuid = { version = "1.13.2", features = ["serde", "v4"] }
